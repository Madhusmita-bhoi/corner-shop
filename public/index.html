<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corner Shop</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--ink:#14232b;--muted:#5d6f78;--line:#d8e2e4;--brand:#0f8f7e;--brand-d:#0a6b5e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;margin-right:auto}
input,select,textarea{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
header input,header select{width:auto}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--brand);color:#fff}
button:hover{background:var(--brand-d)}
button.alt{background:transparent;border:1.5px solid #ffffff55}
button.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
:focus-visible{outline:3px solid #7fe0d2;outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:28px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pic{font-size:54px;text-align:center;background:var(--bg);border-radius:10px;padding:12px}
.card h3{margin:4px 0 0;font-size:17px}.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.price{font-weight:800;font-size:18px}.stock{font-size:13px;color:var(--muted)}
dialog{border:0;border-radius:14px;padding:22px;width:min(460px,92vw);box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 12px}
form{display:grid;gap:10px}label{font-weight:600;font-size:14px}
.line-item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;gap:6px;align-items:center}.qty button{padding:2px 10px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:12px 0}
.err{color:#b3261e;font-size:14px;min-height:20px}
.order{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:20}
.empty{color:var(--muted);padding:20px 0}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Corner Shop</div>
  <input id="q" type="search" placeholder="Search products" aria-label="Search products">
  <select id="cat" aria-label="Category"><option value="">All categories</option></select>
  <button id="addBtn" class="alt" hidden>Add product</button>
  <button id="ordersBtn" class="alt" hidden>My orders</button>
  <button id="authBtn" class="alt">Log in</button>
  <button id="cartBtn">Cart (0)</button>
</div></header>

<main>
  <h1>Everyday things, delivered</h1>
  <p class="sub" id="hello">Browse the shop and add items to your cart.</p>
  <div class="grid" id="grid"></div>
</main>

<dialog id="cartDlg"><h2>Your cart</h2><div id="cartBody"></div>
  <div class="total"><span>Total</span><span id="cartTotal">$0.00</span></div>
  <div class="err" id="cartErr"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="line" data-close>Close</button><button id="checkout">Place order</button></div>
</dialog>

<dialog id="authDlg"><h2 id="authTitle">Log in</h2>
  <form id="authForm">
    <div id="nameRow" hidden><label for="aName">Name</label><input id="aName"></div>
    <div><label for="aEmail">Email</label><input id="aEmail" type="email" required></div>
    <div><label for="aPass">Password</label><input id="aPass" type="password" required minlength="6"></div>
    <div class="err" id="authErr"></div>
    <button type="submit" id="authSubmit">Log in</button>
    <button type="button" class="line" id="authSwitch">New here? Create an account</button>
    <button type="button" class="line" data-close>Cancel</button>
  </form>
</dialog>

<dialog id="ordersDlg"><h2>My orders</h2><div id="ordersBody"></div><br><button class="line" data-close>Close</button></dialog>

<dialog id="addDlg"><h2>Add product</h2>
  <form id="addForm">
    <div><label for="pName">Name</label><input id="pName" required></div>
    <div><label for="pCat">Category</label><input id="pCat" value="General"></div>
    <div><label for="pPrice">Price</label><input id="pPrice" type="number" step="0.01" min="0.01" required></div>
    <div><label for="pStock">Stock</label><input id="pStock" type="number" min="0" value="10"></div>
    <div><label for="pEmoji">Emoji icon</label><input id="pEmoji" value="📦"></div>
    <div><label for="pDesc">Description</label><textarea id="pDesc" rows="2"></textarea></div>
    <div class="err" id="addErr"></div>
    <button type="submit">Save product</button><button type="button" class="line" data-close>Cancel</button>
  </form>
</dialog>
<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const state = {
  token: localStorage.getItem('token'),
  user: JSON.parse(localStorage.getItem('user') || 'null'),
  cart: JSON.parse(localStorage.getItem('cart') || '[]'),
  catalog: {}, registering: false
};
const money = n => '$' + n.toFixed(2);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

/* ---------- Products ---------- */
async function loadProducts() {
  const list = await api(`/products?q=${encodeURIComponent($('#q').value)}&category=${encodeURIComponent($('#cat').value)}`);
  list.forEach(p => state.catalog[p.id] = p);
  const cats = [...new Set(Object.values(state.catalog).map(p => p.category))];
  const sel = $('#cat'), cur = sel.value;
  sel.replaceChildren(new Option('All categories', ''), ...cats.map(c => new Option(c, c)));
  sel.value = cur;
  const grid = $('#grid'); grid.replaceChildren();
  if (!list.length) grid.append(h('div', 'empty', 'No products match your search. Try a different word or category.'));
  list.forEach(p => {
    const c = h('div', 'card');
    c.append(h('div', 'pic', p.emoji), h('h3', null, p.name), h('p', null, p.description),
      h('div', 'price', money(p.price)), h('div', 'stock', p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'));
    const b = h('button', null, 'Add to cart'); b.disabled = p.stock < 1;
    b.onclick = () => addToCart(p.id);
    c.append(b); grid.append(c);
  });
}

/* ---------- Cart ---------- */
function saveCart() { localStorage.setItem('cart', JSON.stringify(state.cart)); $('#cartBtn').textContent = `Cart (${state.cart.reduce((s, i) => s + i.qty, 0)})`; }
function addToCart(id) {
  const it = state.cart.find(i => i.id === id);
  if (it) it.qty++; else state.cart.push({ id, qty: 1 });
  saveCart(); toast('Added to cart');
}
function renderCart() {
  const body = $('#cartBody'); body.replaceChildren(); let total = 0;
  if (!state.cart.length) body.append(h('div', 'empty', 'Your cart is empty. Add something from the shop.'));
  state.cart.forEach((it, idx) => {
    const p = state.catalog[it.id]; if (!p) return;
    total += p.price * it.qty;
    const row = h('div', 'line-item');
    row.append(h('span', null, `${p.emoji} ${p.name}`));
    const q = h('div', 'qty');
    const minus = h('button', 'line', '−'), plus = h('button', 'line', '+');
    minus.onclick = () => { it.qty--; if (it.qty < 1) state.cart.splice(idx, 1); saveCart(); renderCart(); };
    plus.onclick = () => { it.qty++; saveCart(); renderCart(); };
    q.append(minus, h('span', null, String(it.qty)), plus, h('b', null, money(p.price * it.qty)));
    row.append(q); body.append(row);
  });
  $('#cartTotal').textContent = money(total); $('#cartErr').textContent = '';
}
$('#cartBtn').onclick = () => { renderCart(); $('#cartDlg').showModal(); };
$('#checkout').onclick = async () => {
  if (!state.cart.length) return;
  if (!state.token) { $('#cartDlg').close(); openAuth(); return; }
  try {
    const r = await api('/orders', { method: 'POST', body: { items: state.cart } });
    state.cart = []; saveCart(); $('#cartDlg').close();
    toast(`Order #${r.id} placed: ${money(r.total)}`); loadProducts();
  } catch (e) { $('#cartErr').textContent = e.message; }
};

/* ---------- Auth ---------- */
function paintAuth() {
  $('#authBtn').textContent = state.user ? 'Log out' : 'Log in';
  $('#ordersBtn').hidden = !state.user;
  $('#addBtn').hidden = !(state.user && state.user.role === 'admin');
  $('#hello').textContent = state.user ? `Welcome back, ${state.user.name}.` : 'Browse the shop and add items to your cart.';
}
function openAuth() { setMode(false); $('#authErr').textContent = ''; $('#authDlg').showModal(); }
function setMode(reg) {
  state.registering = reg;
  $('#nameRow').hidden = !reg;
  $('#authTitle').textContent = $('#authSubmit').textContent = reg ? 'Create account' : 'Log in';
  $('#authSwitch').textContent = reg ? 'Have an account? Log in' : 'New here? Create an account';
}
$('#authSwitch').onclick = () => setMode(!state.registering);
$('#authBtn').onclick = () => {
  if (state.user) { state.token = state.user = null; localStorage.removeItem('token'); localStorage.removeItem('user'); paintAuth(); toast('Logged out'); }
  else openAuth();
};
$('#authForm').onsubmit = async e => {
  e.preventDefault();
  try {
    const r = await api(state.registering ? '/auth/register' : '/auth/login', {
      method: 'POST', body: { name: $('#aName').value, email: $('#aEmail').value, password: $('#aPass').value }
    });
    state.token = r.token; state.user = r.user;
    localStorage.setItem('token', r.token); localStorage.setItem('user', JSON.stringify(r.user));
    $('#authDlg').close(); e.target.reset(); paintAuth(); toast('Logged in');
  } catch (err) { $('#authErr').textContent = err.message; }
};

/* ---------- Orders and admin ---------- */
$('#ordersBtn').onclick = async () => {
  const body = $('#ordersBody'); body.replaceChildren();
  try {
    const orders = await api('/orders');
    if (!orders.length) body.append(h('div', 'empty', 'No orders yet.'));
    orders.forEach(o => {
      const d = h('div', 'order');
      d.append(h('b', null, `Order #${o.id} · ${money(o.total)}`), h('div', null, o.items.map(i => `${i.qty} × ${i.name}`).join(', ')), h('div', 'stock', o.created_at));
      body.append(d);
    });
  } catch (e) { body.append(h('div', 'err', e.message)); }
  $('#ordersDlg').showModal();
};
$('#addBtn').onclick = () => { $('#addErr').textContent = ''; $('#addDlg').showModal(); };
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  try {
    await api('/products', { method: 'POST', body: {
      name: $('#pName').value, category: $('#pCat').value, price: parseFloat($('#pPrice').value),
      stock: parseInt($('#pStock').value || '0', 10), emoji: $('#pEmoji').value, description: $('#pDesc').value } });
    $('#addDlg').close(); e.target.reset(); toast('Product added'); loadProducts();
  } catch (err) { $('#addErr').textContent = err.message; }
};

document.querySelectorAll('[data-close]').forEach(b => b.onclick = e => { e.preventDefault(); b.closest('dialog').close(); });
let t; $('#q').oninput = () => { clearTimeout(t); t = setTimeout(loadProducts, 250); };
$('#cat').onchange = loadProducts;
paintAuth(); saveCart(); loadProducts();
</script>
</body>
</html>
